name: Notify Vocabulary JSON

# Run after "Build and deploy" (main.yml) has regenerated and committed the
# .ttl files on editor, so vocabulary-json never syncs a stale version.
# A plain `push` trigger would race main.yml, and main.yml's own commits
# (made with GITHUB_TOKEN) can't start other workflows.
on:
  workflow_run:
    workflows: ["Build and deploy"]
    types: [completed]
    branches: [editor]

jobs:
  notify-parent:
    # Only after a successful run caused by a push (not a pull request)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger vocabulary-json sync workflow
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.VOCAB_JSON_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/iqb-vocabs/vocabulary-json/dispatches \
            -d '{"event_type": "vocab-updated", "client_payload": {"repo": "${{ github.event.repository.name }}"}}'
